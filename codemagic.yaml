workflows:
  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: 26.2.0
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Check Firebase iOS Configuration
        script: |
          if [ -f ios/Runner/GoogleService-Info.plist ]; then
            echo "Firebase iOS configuration found"
          else
            echo "ERROR: GoogleService-Info.plist missing"
            exit 1
          fi
      - name: Fix Swift Bridging Header Configuration
        script: |
          ruby <<'RUBY'
          require 'xcodeproj'

          projects = [
            'ios/Runner.xcodeproj',
            'ios/Pods/Pods.xcodeproj'
          ]

          projects.each do |project_path|
            next unless File.exist?(project_path)

            project = Xcodeproj::Project.open(project_path)

            project.build_configurations.each do |config|
              config.build_settings['BUILD_LIBRARY_FOR_DISTRIBUTION'] = 'NO'
            end

            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['BUILD_LIBRARY_FOR_DISTRIBUTION'] = 'NO'
              end
            end

            project.save
            puts "Updated: #{project_path}"
          end
          RUBY
      - name: Build iOS app for simulator
        script: |
          flutter build ios --simulator --debug -v
      - name: Zip simulator app
        script: |
          cd build/ios/iphonesimulator
          zip -r Runner-simulator.zip Runner.app
    artifacts:
      - build/ios/iphonesimulator/*.app
      - build/ios/iphonesimulator/Runner-simulator.zip
    publishing:
      email:
        recipients:
          - awaysofttech@gmail.com
        notify:
          success: true
          failure: true
