
workflows:
  ios-simulator-build:
    name: IPC Delegate - iOS Simulator
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: 3.11.0
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Check Build Environment
        script: |
          flutter --version
          dart --version
          xcodebuild -version
          pod --version

      - name: Clean Flutter Project
        script: |
          flutter clean

      - name: Get Flutter Dependencies
        script: |
          flutter pub get

      - name: Check Firebase Configuration
        script: |
          if [ ! -f ios/Runner/GoogleService-Info.plist ]; then
            echo "WARNING: GoogleService-Info.plist not found"
            echo "Check Firebase iOS configuration."
          fi

      - name: Install iOS Dependencies
        script: |
          cd ios
          pod install
          cd ..

      - name: Build iOS Simulator
        script: |
          flutter build ios \
            --simulator \
            --debug \
            --verbose

    artifacts:
      - build/ios/iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

publishing:
  email:
    recipients:
      - contact@awaysofttech.com
    notify:
      success: true
      failure: true
