# ==========================================
# 3. IOS RELEASE + TESTFLIGHT
# ==========================================
workflows:

  ios-release:
    name: iOS Signed Release - TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic

    environment:
      flutter: 3.50.1
      xcode: 26.6
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ipc.delegates

    scripts:
      - name: Check environment
        script: |
          flutter --version
          xcodebuild -version

      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Install Flutter dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Validate Firebase configuration
        script: |
          test -f ios/Runner/GoogleService-Info.plist

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Configure iOS signing
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/**/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

      email:
        recipients:
          - laxmimulewa1987@gmail.com
        notify:
          success: true
          failure: true