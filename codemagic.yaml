
workflows:
  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: 26.2.0
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Configure Flutter
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Clean Flutter Project
        script: |
          flutter clean
          rm -rf build/ios

      - name: Get Flutter Packages
        script: |
          flutter pub get

      - name: Verify Firebase Configuration
        script: |
          set -e

          PLIST="ios/Runner/GoogleService-Info.plist"

          test -f "$PLIST" || {
            echo "ERROR: GoogleService-Info.plist not found!"
            exit 1
          }

          plutil -lint "$PLIST"

          FIREBASE_BUNDLE_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :BUNDLE_ID" "$PLIST")

          echo "Firebase Bundle ID: $FIREBASE_BUNDLE_ID"

          if [ "$FIREBASE_BUNDLE_ID" != "com.ipc.delegates" ]; then
            echo "ERROR: Firebase Bundle ID mismatch!"
            exit 1
          fi

          test -f lib/firebase_options.dart || {
            echo "ERROR: firebase_options.dart not found!"
            exit 1
          }

      - name: Install CocoaPods Dependencies
        script: |
          cd ios
          pod install
          cd ..

      - name: Add Firebase Plist to Runner Target
        script: |
          ruby <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.find { |t| t.name == 'Runner' }

          abort 'Runner target not found!' unless target

          group = project.main_group.find_subpath('Runner', true)

          file_ref = group.files.find do |file|
            file.path == 'GoogleService-Info.plist'
          end

          file_ref ||= group.new_file('GoogleService-Info.plist')

          unless target.resources_build_phase.files_references.include?(file_ref)
            target.resources_build_phase.add_file_reference(file_ref, true)
          end

          project.save
          puts 'Firebase plist registered.'
          RUBY

      - name: Fix Swift Bridging Header Configuration
        script: |
          ruby <<'RUBY'
          require 'xcodeproj'

          [
            'ios/Runner.xcodeproj',
            'ios/Pods/Pods.xcodeproj'
          ].each do |path|
            next unless File.exist?(path)

            project = Xcodeproj::Project.open(path)

            project.build_configurations.each do |config|
              config.build_settings['BUILD_LIBRARY_FOR_DISTRIBUTION'] = 'NO'
              config.build_settings['SWIFT_EMIT_MODULE_INTERFACE'] = 'NO'
            end

            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['BUILD_LIBRARY_FOR_DISTRIBUTION'] = 'NO'
                config.build_settings['SWIFT_EMIT_MODULE_INTERFACE'] = 'NO'
              end
            end

            project.save
            puts "Updated #{path}"
          end
          RUBY

      - name: Build and Create Simulator ZIP
        script: |
          echo "===== STARTING SIMULATOR BUILD ====="

          flutter build ios --simulator --debug --no-codesign -v

          BUILD_STATUS=$?

          echo "===== SEARCHING FOR RUNNER.APP ====="

          find build/ios -type d -name "Runner.app" -print 2>/dev/null || true

          APP_PATH="build/ios/iphonesimulator/Runner.app"
          ZIP_PATH="build/ios/Runner-simulator.zip"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Simulator Runner.app was not generated."
            echo "Checking all available build files:"
            find build/ios -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "===== VERIFYING APP ====="

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Info.plist missing!"
            exit 1
          fi

          APP_EXECUTABLE=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")

          if [ ! -f "$APP_PATH/$APP_EXECUTABLE" ]; then
            echo "ERROR: App executable missing!"
            exit 1
          fi

          echo "App executable: $APP_EXECUTABLE"

          echo "===== CREATING ZIP ====="

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" "$ZIP_PATH"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "ERROR: ZIP creation failed!"
            exit 1
          fi

          echo "===== ZIP CREATED SUCCESSFULLY ====="
          ls -lh "$ZIP_PATH"

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "WARNING: Flutter build returned error: $BUILD_STATUS"
            exit "$BUILD_STATUS"
          fi    

    artifacts:
      - build/ios/Runner-simulator.zip
      - build/ios/iphonesimulator/Runner.app

    publishing:
      email:
        recipients:
          - awaysofttech@gmail.com
        notify:
          success: true
          failure: true
