
workflows:
  ios-release:
    name: 75th IPC - iOS TestFlight Internal
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic

    environment:
      flutter: 3.50.1
      xcode: 26.6
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ipc.delegates

    scripts:
      - name: Check Environment
        script: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Clean Flutter and Install Dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Validate Firebase
        script: |
          test -f ios/Runner/GoogleService-Info.plist

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

          echo "Checking CocoaPods synchronization..."

          if ! cmp -s Podfile.lock Pods/Manifest.lock; then
            echo "ERROR: Podfile.lock and Manifest.lock are different"
            diff -u Podfile.lock Pods/Manifest.lock || true
            exit 1
          fi

          echo "CocoaPods synchronized successfully"
          cd ..

      - name: Configure iOS Signing
        script: |
          xcode-project use-profiles

      - name: Build iOS Release IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

          echo "Generated IPA files:"
          ls -lah build/ios/ipa/

          test -n "$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"

    artifacts:
      - build/ios/ipa/*.ipa
      - ios/Podfile.lock
      - /tmp/xcodebuild_logs/**/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - IPC Internal Testers

      email:
        recipients:
          - laxmimulewa1987@gmail.com
        notify:
          success: true
          failure: true
