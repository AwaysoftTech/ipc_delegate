workflows:
  ios-release:
    name: 75th IPC - iOS TestFlight Internal
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic

    environment:
      flutter: 3.50.1
      xcode: 26.6
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ipc.delegates

    scripts:
      - name: Check Environment
        script: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Validate Firebase
        script: |
          test -f ios/Runner/GoogleService-Info.plist

      - name: Verify Dependency Manager
        script: |
          flutter config --list
          grep -A 5 '^flutter:' pubspec.yaml

          - name: Clean Project
            script: |
              flutter clean
              rm -rf ios/Pods
              rm -rf ios/.symlinks
              rm -rf ios/build

          - name: Install Flutter Dependencies
            script: |
              flutter pub get

          - name: Install CocoaPods
            script: |
              cd ios
              pod install --repo-update --clean-install
                
              echo "Checking lock files..."
              cmp -s Podfile.lock Pods/Manifest.lock || {
                echo "Podfile.lock mismatch"
                diff -u Podfile.lock Pods/Manifest.lock || true
                exit 1
              }
              cd ..

      - name: Configure iOS Signing
        script: |
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Build iOS Release IPA
        script: |
          flutter build ipa \
            --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

          echo "Generated IPA files:"
          ls -lah build/ios/ipa/

          test -n "$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"

      - name: Verify IPA
        script: |
          IPA=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          echo "Release IPA generated: $IPA"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" \
            /tmp/Runner.app/Info.plist 2>/dev/null || true

    artifacts:
      - build/ios/ipa/*.ipa
      - ios/Podfile.lock
      - /tmp/xcodebuild_logs/**/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - IPC Internal Testers

      email:
        recipients:
          - laxmimulewa1987@gmail.com
        notify:
          success: true
          failure: true
