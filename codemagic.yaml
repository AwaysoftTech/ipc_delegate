
workflows:
  ios-simulator:
    name: Flutter iOS Simulator Build
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Show build environment
        script: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Clean Flutter build
        script: |
          flutter clean
          flutter pub get

      - name: Reinstall iOS dependencies
        script: |
          cd ios
          pod deintegrate
          rm -rf Pods
          pod install --repo-update
          cd ..

      - name: Build iOS Simulator app
        script: |
          set -o pipefail
          flutter build ios --simulator --debug -v 2>&1 | tee /tmp/ios-simulator-build.log

    artifacts:
      - build/ios/iphonesimulator/*.app
      - /tmp/ios-simulator-build.log
      - /tmp/xcodebuild_logs/*.log

  ios-release:
    name: Flutter iOS Release IPA
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Show build environment
        script: |
          flutter --version
          xcodebuild -version

      - name: Clean Flutter build
        script: |
          flutter clean
          flutter pub get

      - name: Install iOS dependencies
        script: |
          cd ios
          pod install
          cd ..

      - name: Build iOS IPA
        script: |
          set -o pipefail
          flutter build ipa --release -v 2>&1 | tee /tmp/ios-release-build.log

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/ios-release-build.log
      - /tmp/xcodebuild_logs/*.log
