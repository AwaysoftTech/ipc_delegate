
workflows:
  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: 26.2.0
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Clean Flutter Project
        script: |
          flutter clean

      - name: Get Flutter Packages
        script: |
          flutter pub get

      - name: Verify Firebase Configuration
        script: |
          set -e

          PLIST="ios/Runner/GoogleService-Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: GoogleService-Info.plist not found!"
            exit 1
          fi

          plutil -lint "$PLIST"

          FIREBASE_BUNDLE_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :BUNDLE_ID" "$PLIST")

          echo "Firebase Bundle ID: $FIREBASE_BUNDLE_ID"

          if [ "$FIREBASE_BUNDLE_ID" != "com.ipc.delegates" ]; then
            echo "ERROR: Firebase Bundle ID mismatch!"
            exit 1
          fi

          if [ ! -f "lib/firebase_options.dart" ]; then
            echo "ERROR: firebase_options.dart not found!"
            exit 1
          fi

          echo "Firebase configuration verified."

      - name: Install CocoaPods Dependencies
        script: |
          cd ios
          pod install
          cd ..

      - name: Add Firebase Plist to Runner Target
        script: |
          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          target = project.targets.find { |t| t.name == 'Runner' }

          abort 'ERROR: Runner target not found!' unless target

          runner_group = project.main_group.find_subpath('Runner', true)

          file_ref = runner_group.files.find do |file|
            file.path == 'GoogleService-Info.plist'
          end

          file_ref ||= runner_group.new_file('GoogleService-Info.plist')

          resources = target.resources_build_phase

          unless resources.files_references.include?(file_ref)
            resources.add_file_reference(file_ref, true)
            puts 'Added GoogleService-Info.plist to Runner resources.'
          else
            puts 'GoogleService-Info.plist already registered.'
          end

          project.save
          puts 'Runner Xcode project updated successfully.'
          RUBY

      - name: Fix Swift Bridging Header Configuration
        script: |
          ruby <<'RUBY'
          require 'xcodeproj'

          projects = [
            'ios/Runner.xcodeproj',
            'ios/Pods/Pods.xcodeproj'
          ]

          projects.each do |project_path|
            next unless File.exist?(project_path)

            project = Xcodeproj::Project.open(project_path)

            project.build_configurations.each do |config|
              config.build_settings['BUILD_LIBRARY_FOR_DISTRIBUTION'] = 'NO'
            end

            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['BUILD_LIBRARY_FOR_DISTRIBUTION'] = 'NO'
              end
            end

            project.save
            puts "Updated: #{project_path}"
          end
          RUBY

      - name: Fix Swift Module Interface Configuration
        script: |
          echo "Checking Swift build settings..."

          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"

          grep -n "BUILD_LIBRARY_FOR_DISTRIBUTION" "$PROJECT_FILE" || true

          python3 - <<'PY'
          from pathlib import Path

          file = Path("ios/Runner.xcodeproj/project.pbxproj")

          content = file.read_text()

          content = content.replace(
              "BUILD_LIBRARY_FOR_DISTRIBUTION = YES;",
              "BUILD_LIBRARY_FOR_DISTRIBUTION = NO;"
          )

          file.write_text(content)

          print("BUILD_LIBRARY_FOR_DISTRIBUTION set to NO")
          PY

          grep -n "BUILD_LIBRARY_FOR_DISTRIBUTION" "$PROJECT_FILE" || true      


      - name: Build iOS App for Appetize
        script: |
          set -e

          flutter build ios \
            --simulator \
            --debug \
            --no-codesign \
            -v

      - name: Verify Appetize Simulator Binary
        script: |
          set -e

          APP_PATH="build/ios/iphonesimulator/Runner.app"
          PLIST="$APP_PATH/GoogleService-Info.plist"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Simulator Runner.app not found!"
            find build/ios -name "Runner.app" -type d
            exit 1
          fi

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Firebase plist missing!"
            exit 1
          fi

          plutil -lint "$PLIST"

          FIREBASE_BUNDLE_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :BUNDLE_ID" "$PLIST")

          APP_BUNDLE_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")

          echo "Firebase Bundle ID: $FIREBASE_BUNDLE_ID"
          echo "App Bundle ID: $APP_BUNDLE_ID"

          if [ "$FIREBASE_BUNDLE_ID" != "$APP_BUNDLE_ID" ]; then
            echo "ERROR: Bundle ID mismatch!"
            exit 1
          fi

          EXECUTABLE=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")

          APP_BINARY="$APP_PATH/$EXECUTABLE"

          echo "===== BINARY ARCHITECTURE ====="
          file "$APP_BINARY"
          lipo -archs "$APP_BINARY"

          echo "===== SIMULATOR PLATFORM ====="
          xcrun vtool -show-build "$APP_BINARY" | tee /tmp/app-build-info.txt

          if ! grep -q "IOSSIMULATOR" /tmp/app-build-info.txt; then
            echo "ERROR: Binary is not an iOS Simulator build!"
            exit 1
          fi

          echo "SUCCESS: Simulator binary verified."

      - name: Create Appetize ZIP
        script: |
          set -e

          APP_PATH="build/ios/iphonesimulator/Runner.app"
          ZIP_PATH="build/ios/Runner.app.zip"

          mkdir -p build/ios
          rm -f "$ZIP_PATH"

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" "$ZIP_PATH"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "ERROR: ZIP generation failed!"
            exit 1
          fi

          echo "===== FINAL APPETIZE FILE ====="
          ls -lh "$ZIP_PATH"

          unzip -l "$ZIP_PATH" | head -20

          echo "SUCCESS: Appetize ZIP generated."

    artifacts:
      - build/ios/Runner.app.zip

    publishing:
      email:
        recipients:
          - awaysofttech@gmail.com
        notify:
          success: true
          failure: true
