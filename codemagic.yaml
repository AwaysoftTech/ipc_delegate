
workflows:
  ios-release:
    name: 75th IPC - iOS TestFlight Internal
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic

    environment:
      flutter: 3.50.1
      xcode: 26.6
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ipc.delegates

    scripts:
      - name: Check Environment
        script: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Clean Flutter and Install Dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Validate Firebase
        script: |
          test -f ios/Runner/GoogleService-Info.plist

      - name: Install CocoaPods and Verify Dependencies
        script: |
          cd ios
            
          pod install
            
          echo "========== PODFILE LOCK =========="
            
          if [ -f Podfile.lock ]; then
            cat Podfile.lock
            echo "Podfile.lock generated successfully"
          else
            echo "ERROR: Podfile.lock not generated"
            exit 1
          fi
            
          echo "========== AWESOME NOTIFICATIONS =========="
          grep -A 5 "awesome_notifications" Podfile.lock || true
            
          echo "========== IOS AWN CORE =========="
          grep -A 5 "IosAwnCore" Podfile.lock || true
            
          echo "========== FIREBASE CORE =========="
          grep -A 5 "FirebaseCore" Podfile.lock || true
            
          cd ..

      - name: Configure iOS Signing
        script: |
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Build iOS Release IPA
        script: |
          flutter build ipa \
            --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

          echo "Generated IPA files:"
          ls -lah build/ios/ipa/

          test -n "$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"

      - name: Verify IPA
        script: |
          IPA=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          echo "Release IPA generated: $IPA"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" \
            /tmp/Runner.app/Info.plist 2>/dev/null || true

    artifacts:
      - build/ios/ipa/*.ipa
      - ios/Podfile.lock
      - /tmp/xcodebuild_logs/**/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - IPC Internal Testers

      email:
        recipients:
          - laxmimulewa1987@gmail.com
        notify:
          success: true
          failure: true
