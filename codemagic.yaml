
workflows:
  ios-release:
    name: 75th IPC - iOS TestFlight Internal
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic

    environment:
      flutter: 3.50.1
      xcode: 26.6
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ipc.delegates

    scripts:
      - name: Check environment
        script: |
          flutter --version
          xcodebuild -version

      - name: Install Flutter dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Validate Firebase
        script: |
          test -f ios/Runner/GoogleService-Info.plist

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Configure iOS signing - Internal Only
        script: |
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Build signed Release IPA
        script: |
          flutter build ipa --release

          echo "Checking IPA..."
          ls -lh build/ios/ipa/*.ipa

          test -n "$(find build/ios/ipa -name '*.ipa' -print -quit)"

    artifacts:
      - build/ios/ipa/*.ipa
      - ios/Podfile.lock
      - /tmp/xcodebuild_logs/**/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - IPC Internal Testers

      email:
        recipients:
          - laxmimulewa1987@gmail.com
        notify:
          success: true
          failure: true
