name: ipc_delegates
description: "75th Indian Pharmaceutical Congress 2026"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+2

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  package_info_plus: ^9.0.0

  flutter:
    sdk: flutter

  intl: ^0.20.3
  get: ^4.7.3
  http: ^1.6.0
  introduction_screen: ^4.0.0
  flutter_svg: ^2.0.4
  lottie: ^3.5.1
  shared_preferences: ^2.5.5
  flutter_widget_from_html: ^0.17.2
  flutter_spinkit: ^5.2.2
  cached_network_image: ^3.4.1
  nb_utils: ^7.0.6
  flutter_html: ^3.0.0-beta.2
  auto_size_text: ^3.0.0
  mobile_scanner: ^7.4.2
  dropdown_button2: ^2.3.9
  audioplayers: ^6.5.1
  url_launcher: ^6.3.2
  flutter_linkify: ^6.0.0
  universal_html: ^2.3.0

  # Firebase Services
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4

  # Notifications
  awesome_notifications: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section
  assets:
    - assets/images/
    - assets/animation/
    - assets/lang/
    - assets/sound/

  fonts:
    - family: Montserrat-Arabic
      fonts:
        - asset: assets/fonts/Montserrat-Arabic-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-Arabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Arabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-Arabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Arabic-Bold.ttf
          weight: 700
